name: CI

on:
    push:
        branches: [main, aligo]
    pull_request:
        branches: [main, aligo]

jobs:
    frontend:
        name: Frontend (Next.js)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Type check + build
              run: npm run build

            - name: Test
              run: npm test

    backend:
        name: Backend (Express)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: server
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: server/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Type check + build
              run: npm run build

            - name: Test
              run: npm test
