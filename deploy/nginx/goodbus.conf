# Primary HTTPS path (see DEPLOYMENT.md) — Cafe24 VPS ships with Nginx pre-installed.
# sudo ln -s /var/www/goodbus/deploy/nginx/goodbus.conf /etc/nginx/sites-enabled/
# sudo certbot --nginx -d your-domain.com

# zone/map declarations must live in the `http` block — sites-enabled/* is
# included there on the stock Debian/Ubuntu nginx.conf layout, so this is valid here.
limit_req_zone $binary_remote_addr zone=goodbus_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=goodbus_auth:10m rate=2r/s;

# Cloudflare proxy support: once DNS is "Proxied" (orange cloud), every request
# arrives from a Cloudflare edge IP, not the visitor's real IP. Without this,
# $remote_addr (and the rate limit zones/X-Real-IP header keyed on it below)
# would see one Cloudflare IP for all visitors and rate-limit everyone as a
# single client. ngx_http_realip_module only rewrites $remote_addr when the
# TCP peer is actually inside one of these ranges, so this is safe to deploy
# before Cloudflare is turned on — direct/non-Cloudflare traffic is unaffected.
# List current as of 2026-08; re-check https://www.cloudflare.com/ips/ if
# Cloudflare ever rotates their edge ranges.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Noise reduction only, not a real defense — a User-Agent header is trivial to
# spoof, so this just quiets unsophisticated automated scanners (the same class
# of tool that originally found the 2026-08-14 Next.js CVE) without wasting a
# proxy_pass to Next.js on them. The actual defense is patching + rate limiting.
# Update this list as new scanner signatures show up in access logs.
map $http_user_agent $goodbus_bad_bot {
    default 0;
    "~*(sqlmap|nikto|nessus|nmap|masscan|zgrab|acunetix|nuclei|dirbuster|gobuster|wpscan)" 1;
    "" 1; # empty User-Agent — browsers always send one, scripts often don't
}

server {
    listen 80;
    server_name your-domain.com;

    client_max_body_size 20M;

    if ($goodbus_bad_bot) {
        return 444; # close connection, no response — cheaper than a real reply
    }

    # Common automated vulnerability-scanner probe paths (WordPress, phpMyAdmin,
    # exposed .git/.env, etc.) — this app is none of these, so there's never a
    # legitimate reason to serve a real response here.
    location ~* /(wp-admin|wp-login|phpmyadmin|pma|\.env|\.git|xmlrpc\.php|\.aws|config\.php)(/|$) {
        return 444;
    }

    # Defense-in-depth alongside the app-level fixes (see CLAUDE.md) — none of
    # these change existing behavior for legitimate traffic.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS intentionally omitted: only add it once HTTPS via certbot is
    # confirmed to always be reachable — a bad HSTS header can lock browsers
    # out of the domain if HTTPS ever breaks.

    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Auth endpoints already have app-level rate limiting (OTP request) or
    # bcrypt's own cost (login), but a tighter Nginx-level limit catches
    # anything in between (signup, etc.) before it reaches Next.js at all.
    location /api/auth/ {
        limit_req zone=goodbus_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        limit_req zone=goodbus_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
