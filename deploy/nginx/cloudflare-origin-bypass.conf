# Cloudflare origin-bypass block for busrent.co.kr.
#
# Once Cloudflare DNS is "Proxied" (orange cloud), Cloudflare's edge protections
# (WAF, rate limiting, bot mitigation, DDoS mitigation) only apply to requests
# that actually go through Cloudflare. Our origin IP isn't secret — it's directly
# reachable via the Cafe24-assigned hostname (e.g. busrent0909.mycafe24.com,
# unproxied by design) and via DNS history for busrent.co.kr — so anyone who
# finds it can send `Host: busrent.co.kr` straight to the origin IP and skip
# Cloudflare's protections entirely. This file closes that gap: any request
# claiming Host busrent.co.kr/www that did NOT arrive from a real Cloudflare
# edge IP gets its connection closed (444), no response body.
#
# Deploy as its own file (e.g. /etc/nginx/conf.d/goodbus-cloudflare.conf on the
# live server — this repo doesn't auto-deploy nginx config, see DEPLOYMENT.md
# "0. 현재 실제 배포 현황"). Include at the `http` block level (conf.d/*.conf is
# included there by default on stock Debian/Ubuntu nginx.conf), then add the
# `if` block below inside every server block for a domain that should be
# Cloudflare-only. Deliberately do NOT add it to the Cafe24-hostname server
# block (busrent0909.mycafe24.com) — that hostname is unproxied on purpose so
# UptimeRobot (or similar) can health-check the origin directly.
#
# IP list current as of 2026-09 (https://www.cloudflare.com/ips-v4,
# https://www.cloudflare.com/ips-v6) — re-check if Cloudflare ever rotates
# their edge ranges (rare, but has happened historically).
geo $remote_addr $goodbus_is_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

