# Cloudflare origin-bypass block for busrent.co.kr.
#
# Once Cloudflare DNS is "Proxied" (orange cloud), Cloudflare's edge protections
# (WAF, rate limiting, bot mitigation, DDoS mitigation) only apply to requests
# that actually go through Cloudflare. Our origin IP isn't secret — it's directly
# reachable via the Cafe24-assigned hostname (e.g. busrent0909.mycafe24.com,
# unproxied by design) and via DNS history for busrent.co.kr — so anyone who
# finds it can send `Host: busrent.co.kr` straight to the origin IP and skip
# Cloudflare's protections entirely. This file closes that gap: any request
# claiming Host busrent.co.kr/www that did NOT arrive from a real Cloudflare
# edge IP gets its connection closed (444), no response body.
#
# Deploy as its own file (e.g. /etc/nginx/conf.d/goodbus-cloudflare.conf on the
# live server — this repo doesn't auto-deploy nginx config, see DEPLOYMENT.md
# "0. 현재 실제 배포 현황"). Include at the `http` block level (conf.d/*.conf is
# included there by default on stock Debian/Ubuntu nginx.conf), then add the
# `if` block below inside every server block for a domain that should be
# Cloudflare-only. Deliberately do NOT add it to the Cafe24-hostname server
# block (busrent0909.mycafe24.com) — that hostname is unproxied on purpose so
# UptimeRobot (or similar) can health-check the origin directly.
#
# IP list current as of 2026-09 (https://www.cloudflare.com/ips-v4,
# https://www.cloudflare.com/ips-v6) — re-check if Cloudflare ever rotates
# their edge ranges (rare, but has happened historically).
# Restore the real visitor IP from Cloudflare's CF-Connecting-IP header, but ONLY
# when the connection really comes from a Cloudflare edge range (set_real_ip_from).
# Without this, $remote_addr is always a Cloudflare edge IP, so the app's per-IP
# rate limits (X-Real-IP is proxy_set_header'd from $remote_addr in the site
# config) bucket unrelated visitors together and the [SECURITY] failed-login
# log records Cloudflare addresses instead of the attacker's. Found 2026-10-11:
# the live Cafe24-generated site config never had this (it only lived in
# deploy/nginx/goodbus.conf, which is not what runs). Putting it here, in
# conf.d, keeps it out of the file Cafe24 regenerates.
#
# Do NOT also load these directives from deploy/nginx/goodbus.conf — a second
# `real_ip_header` in the same context makes `nginx -t` fail with "duplicate".
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# NOTE: keyed on $realip_remote_addr (the TCP peer), not $remote_addr. Once the
# real_ip directives above are active, $remote_addr is the visitor's address, so
# keying this check on it would classify every request as "not Cloudflare" and
# return 444 to the whole site.
geo $realip_remote_addr $goodbus_is_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

