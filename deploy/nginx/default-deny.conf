# Reject any request whose Host header doesn't match a known GoodBus domain —
# notably literal origin-IP access (e.g. https://172.238.20.212/) and other
# Host-header spoofing. Without an explicit default_server, nginx falls back
# to the FIRST server block defined for a given address:port — on this VPS
# that's the busrent0909.mycafe24.com block in /etc/nginx/sites-enabled/busrent
# (kept unproxied on purpose so UptimeRobot can health-check the origin
# directly, see cloudflare-origin-bypass.conf in this directory), which has
# none of the Cloudflare origin-bypass protection that busrent.co.kr/www get.
# So any request with an unrecognized Host — including the bare origin IP —
# silently fell through to that block and reached the app, fully bypassing
# Cloudflare's WAF/rate-limiting/Turnstile.
#
# Deploy as its own file (e.g. /etc/nginx/conf.d/goodbus-default-deny.conf on
# the live server — this repo doesn't auto-deploy nginx config, see
# DEPLOYMENT.md "0. 현재 실제 배포 현황"). Keep it in conf.d, NOT appended to
# sites-available/busrent — Cafe24's auto-install regenerates
# sites-available/<service> on OS reprovision, wiping anything added there
# directly (see DEPLOYMENT.md's /uploads/ proxy block incident, 2026-10-08).
#
# server_name _ only matches when nothing else does — it does not affect
# requests whose Host exactly matches busrent0909.mycafe24.com or
# busrent.co.kr/www, which keep routing to their own named server blocks
# regardless of which block is marked default_server.
#
# The 443 block needs a certificate to complete the TLS handshake for
# unmatched/SNI-less connections even though it never serves real content —
# it reuses the busrent0909.mycafe24.com cert purely for that purpose. Update
# the paths below if that certificate's name ever changes.
#
# Added 2026-11-05 after a Next.js Server Action scanning bot was observed
# hitting the app directly via the bare origin IP, bypassing Cloudflare and
# causing noisy InvariantError reports in Sentry (JAVASCRIPT-NEXTJS-6, issue
# 7827110423) — see .claude/refactor.md for the full investigation. Applied
# and live-verified same day: direct-IP access on both 443 and 80 now closes
# the connection (444); busrent0909.mycafe24.com and busrent.co.kr (via
# Cloudflare) are unaffected; certbot renew --dry-run unaffected for
# busrent0909.mycafe24.com (busrent.co.kr's dry-run hit an unrelated
# Let's Encrypt rate limit during verification, not a routing failure — the
# Host-matched port-80 redirect for busrent.co.kr was confirmed working
# directly, which is the thing the ACME HTTP-01 challenge actually relies on).
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/busrent0909.mycafe24.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/busrent0909.mycafe24.com/privkey.pem;

    return 444;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
